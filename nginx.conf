# 面壁 (OfferPilot) — Nginx 配置（宝塔站点配置参考）
# 用法：在宝塔「网站 → 设置 → 配置文件」中替换或参考此配置
# 关键点：SPA 路由、/api/ 反代到后端、SSE 支持、上传大小限制

server {
    listen 80;
    server_name _;  # 替换为你的域名或 IP

    # 前端 dist 目录（上传到宝塔后的路径）
    root /www/wwwroot/offer-pilot;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 上传大小限制（知识库文件最大 5MB + 简历 PDF）
    client_max_body_size 10m;

    # ===== API 反代到后端 =====
    location /api/ {
        proxy_pass http://127.0.0.1:8080;  # 后端端口，与 application.yaml 一致
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（面试答题流式反馈）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ===== SPA 路由（所有非 API 请求返回 index.html） =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 静态资源缓存 =====
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}